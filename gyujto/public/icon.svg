<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192" role="img" aria-label="Gyűjtő">
  <!-- Vonalkód a kezdőképernyőre. SVG, mert egyetlen fájlból minden méret
       éles marad, és nem kell bináris eszközkészletet vinni a repóba. -->
  <rect width="192" height="192" rx="42" fill="#0f1115"/>
  <g fill="#e9ecf1">
    <rect x="38" y="52" width="8" height="88"/>
    <rect x="54" y="52" width="4" height="88"/>
    <rect x="66" y="52" width="10" height="88"/>
    <rect x="84" y="52" width="4" height="88"/>
    <rect x="96" y="52" width="6" height="88"/>
    <rect x="112" y="52" width="10" height="88"/>
    <rect x="130" y="52" width="4" height="88"/>
    <rect x="142" y="52" width="8" height="88"/>
  </g>
  <!-- A szkennelő vonal: ez különbözteti meg egy sima vonalkód-ikontól. -->
  <rect x="26" y="92" width="140" height="8" rx="4" fill="#4c8dff"/>
</svg>
